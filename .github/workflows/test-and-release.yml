name: Test and Release

# Runs on every push to main and on pull requests, and on version tags to publish a release
on:
    push:
        branches: [main]
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous runs for the same branch or tag when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Type check, lint and package tests
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '22.x'
                  type-checking: true
                  lint: true
            # For version tags: versions agree and the release notes exist, before any expensive step
            - name: Check release metadata
              if: startsWith(github.ref, 'refs/tags/v')
              run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

    # Unit and integration tests on all supported Node.js versions and operating systems
    adapter-tests:
        needs: check-and-lint
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                # All three systems are required by the ioBroker repository checker
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    # Publishes the package to npm (trusted publishing, no token) and creates the GitHub release
    deploy:
        needs: [check-and-lint, adapter-tests]
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        # id-token: npm trusted publishing; contents: GitHub release
        permissions:
            id-token: write
            contents: write
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  # TEMPORARY: only for the very first npm publication. Trusted publishing can only be set up
                  # for a package that exists. Remove this line and the NPM_TOKEN secret afterwards.
                  npm-token: ${{ secrets.NPM_TOKEN }}

    # Attaches the package file to the release and replaces its text with the bilingual release notes
    release-notes:
        needs: deploy
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm pack
            - name: Update GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  gh release upload "$GITHUB_REF_NAME" "iobroker.go-e-wallbox-$version.tgz" --clobber
                  gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file "docs/release-notes/$version.md"
