name: Test

on:
    push:
        branches: [main]
        tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-**']
    pull_request: {}
    # Releases a tag that already exists (Actions → Test → Run workflow)
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing version tag, e.g. v0.1.1'
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check-and-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            - run: npm test

    adapter-tests:
        needs: check-and-lint
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # While the repository is private only Linux is tested: Windows and macOS runners
                # count 2x and 10x against the free Actions minutes. Before publishing switch back to
                # [ubuntu-latest, windows-latest, macos-latest] – public repositories are free.
                os: [ubuntu-latest]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run test:integration

    # Creates the GitHub release with the package file once all tests passed for a version tag.
    release:
        needs: adapter-tests
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - name: Check that tag, package.json and io-package.json agree
              run: |
                  version=$(node -p "require('./package.json').version")
                  io_version=$(node -p "require('./io-package.json').common.version")
                  if [ "$TAG" != "v$version" ] || [ "$io_version" != "$version" ]; then
                      echo "::error::tag $TAG, package.json $version and io-package.json $io_version do not match"
                      exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"
            - run: npm run build
            - run: npm pack
            - name: Check release notes (docs/release-notes/<version>.md, English and German)
              run: |
                  notes="docs/release-notes/$VERSION.md"
                  if [ ! -f "$notes" ] || ! grep -q '^## English' "$notes" || ! grep -q '^## Deutsch' "$notes"; then
                      echo "::error::$notes is missing or lacks the sections '## English' and '## Deutsch'"
                      exit 1
                  fi
                  node -e '
                      const news = require("./io-package.json").common.news[process.argv[1]];
                      if (!news?.en || !news?.de) {
                          console.error("common.news has no English and German entry for " + process.argv[1]);
                          process.exit(1);
                      }
                  ' "$VERSION"
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release create "$TAG" "iobroker.goe-wallbox-$VERSION.tgz"
                  --title "$VERSION" --notes-file "docs/release-notes/$VERSION.md" --verify-tag
